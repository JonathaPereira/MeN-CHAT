plugins { id 'com.android.application' }
android {
    namespace 'app.menchat.android'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'app.menchat.android'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('MENCHAT_KEYSTORE') ?: '../release.jks')
            storePassword System.getenv('MENCHAT_STORE_PASSWORD')
            keyAlias System.getenv('MENCHAT_KEY_ALIAS') ?: 'menchat'
            keyPassword System.getenv('MENCHAT_KEY_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; debuggable false; minifyEnabled false } }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4' }

android.testOptions {
    unitTests.includeAndroidResources = true
    unitTests.all {
        maxHeapSize = '1g'
        jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
        systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','user.home'].each { key ->
            if (System.getProperty(key)) systemProperty key, System.getProperty(key)
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
